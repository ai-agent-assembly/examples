version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/go/*"
      - "/scenarios/live-core-enforcement/go-agent"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "npm"
    directories:
      - "/node/*"
      - "/scenarios/*/node"
      - "/scenarios/sidecar-runtime/examples/node-agent"
      - "/scenarios/live-core-enforcement/node-agent"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "node"
    ignore:
      # TypeScript 6.0.x regresses NodeNext resolution of `node:` builtin
      # imports (TS2591 "Cannot find name 'node:fs'"), breaking the node
      # scenarios that use `node:`-prefixed imports. The affected package.json
      # files pin `typescript ^5.9.3` and say "Bump to ^6 once fixed upstream".
      # Skip major typescript bumps until the upstream regression is fixed.
      # See PRs #104, #105.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/python/*"
      - "/scenarios/*/python"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    ignore:
      # AAASM-4778 accepted risk: mcp and json-repair are transitive-only deps
      # pulled in solely by crewai (crewai-research-crew `live` extra, which CI
      # never installs — it runs the --mock/dev path via `uv sync --extra dev`).
      # crewai~=1.15 hard-pins mcp~=1.26.0 (<1.27) and json-repair~=0.25.2
      # (<0.26) on every released and pre-released version, so no reachable
      # patched version exists until an upstream crewai release relaxes the
      # pins. Remove these ignores once crewai adopts patched mcp/json-repair.
      - dependency-name: "mcp"
      - dependency-name: "json-repair"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    # AAASM-6239: github/codeql-action/init and /analyze are separate
    # dependencies to Dependabot, but analyze refuses a configuration file
    # written by a different version of init ("Loaded a configuration file for
    # version '4.38.2', but running version '4.38.1'"). Ungrouped, one upstream
    # release opens one pull request per step and neither can ever merge: every
    # language leg fails and the top-level CodeQL check degrades to neutral, so
    # the page shows a CodeQL entry that is not red while no analysis ran at
    # all.
    #
    # Both groups are required. applies-to defaults to version-updates, so a
    # single entry would leave the security-advisory path splitting exactly as
    # before -- which is the path that matters most.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
