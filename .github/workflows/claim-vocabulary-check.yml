name: Claim Vocabulary Check

# AAASM-5798 / AAASM-5599: ADR 0033's banned-absolute and undifferentiated-verb
# rules against this repo's reader-facing Markdown (docs/**, README.md, every
# per-example **/README.md, CONTRIBUTING.md). Ported from agent-assembly's
# check_claim_vocabulary.py (AAASM-5679), via docs Hub's, python-sdk's,
# node-sdk's, go-sdk's and arena's (AAASM-5797/5798) ports. Per AAASM-5795's
# federation-by-convention decision this repo's copy is independent -- see
# scripts/check_claim_vocabulary.py's own docstring. Fifth and final
# AAASM-5798 repo-slice.
#
# Path-scoped, matching this repo's own per-ecosystem convention
# (verify-python.yml/verify-node.yml/verify-go.yml each gate on their own
# paths) rather than arena's unfiltered trigger or go-sdk's paths-ignore --
# this repo's existing workflows already narrow by path, so an allow-list
# here is the consistent choice, not an outlier.

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "**/README.md"
      - "CONTRIBUTING.md"
      - "scripts/check_claim_vocabulary.py"
      - ".github/workflows/claim-vocabulary-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "**/README.md"
      - "CONTRIBUTING.md"
      - "scripts/check_claim_vocabulary.py"
      - ".github/workflows/claim-vocabulary-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claim-vocabulary:
    name: Check for banned-absolute and undifferentiated-verb claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the claim-vocabulary self-test
        run: python3 scripts/check_claim_vocabulary.py --selftest

      - name: Scan for banned-absolute and undifferentiated-verb claims
        run: python3 scripts/check_claim_vocabulary.py --root .
