# Migrated from package.json's "pnpm.overrides" (no longer read by pnpm 11+,
# see https://pnpm.io/settings). AAASM-6032: a relock performed with pnpm 11
# silently dropped the "overrides" block package.json declared but pnpm no
# longer honours, breaking `--frozen-lockfile`. pnpm-workspace.yaml is the
# supported home for both pnpm 10 and 11, so a relock stays consistent
# regardless of which major version performs it.
overrides:
  js-yaml: ^4.3.1
  '@modelcontextprotocol/sdk': ^1.30.0
  '@hono/node-server': ^2.0.5
  fast-uri: ^3.1.6
  hono: ^4.12.34
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing) and
  # GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer), both fixed in
  # 6.16.0. express@5 / body-parser@2 already allow it by range, but pinning
  # keeps the resolution explicit and prevents a future relock from drifting
  # back below the fix.
  qs: ^6.16.0

onlyBuiltDependencies:
  - '@agent-assembly/sdk'
  - esbuild
  - protobufjs
