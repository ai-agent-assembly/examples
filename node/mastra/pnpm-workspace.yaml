# Migrated from package.json's "pnpm.overrides" (no longer read by pnpm 11+,
# see https://pnpm.io/settings). AAASM-6032: a relock performed with pnpm 11
# silently dropped the "overrides" block package.json declared but pnpm no
# longer honours, breaking `--frozen-lockfile`. pnpm-workspace.yaml is the
# supported home for both pnpm 10 and 11, so a relock stays consistent
# regardless of which major version performs it.
overrides:
  js-yaml: ^4.3.2
  '@modelcontextprotocol/sdk': ^1.30.0
  '@hono/node-server': ^2.0.5
  fast-uri: ^3.1.6
  hono: ^4.12.34
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing) and
  # GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer), both fixed in
  # 6.16.0. express@5 / body-parser@2 already allow it by range, but pinning
  # keeps the resolution explicit and prevents a future relock from drifting
  # back below the fix.
  qs: ^6.16.0
  # GHSA-m9gg-hp2v-232j (high: in certain configurations getAuthContext returns
  # unauthorized certificates as though they were authorized) and
  # GHSA-f596-whhp-79r4, both fixed in 1.14.5. Transitive only -- no
  # package.json in this repo declares @grpc/grpc-js, so Dependabot's security
  # updates could open no PR for it. Two parents pull it here and both already
  # admit the fix (@agent-assembly/sdk@0.0.1-rc.7 at ^1.14.4, @a2a-js/sdk at
  # ^1.11.0), so this floor pins rather than unblocks. Unscoped is safe because
  # only one instance resolves and every parent is on 1.x; see the sibling
  # examples, which carry the same bump as a plain relock because they have no
  # pnpm-workspace.yaml to put a floor in.
  '@grpc/grpc-js': ^1.14.5

# AAASM-6243: pnpm 11 ignores onlyBuiltDependencies and reads allowBuilds
# instead, so this directory failed `pnpm install` with
# ERR_PNPM_IGNORED_BUILDS despite already declaring the list below. Both
# keys are kept: pnpm 10 honours the first, pnpm 11 the second.
onlyBuiltDependencies:
  - '@agent-assembly/sdk'
  - esbuild
  - protobufjs

allowBuilds:
  '@agent-assembly/sdk': true
  esbuild: true
  protobufjs: true
