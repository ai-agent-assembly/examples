# Exclusions for copy-paste detection.
#
# This is a tutorials/examples repo: every example under python/*, node/*,
# go/*, and snippets/* is intentionally self-contained and copy-paste-able,
# so each one re-implements its own local `policy.py` / `policy.ts` /
# `policy.go` (and a handful of `main.py` / `index.ts` / `test_smoke.py`
# files that follow the same per-framework template). That duplication is
# BY DESIGN — extracting a shared policy module would break the "copy one
# example directory and it just works" contract this repo exists to
# demonstrate. It is not a code smell to fix; it is excluded here rather
# than left to inflate the project's duplication rating.
#
# THIS LIST IS EXACT PATHS, AND THAT MAKES IT STALE-PRONE (AAASM-6206).
# `.sonarcloud.properties` disallows wildcard patterns, so `snippets/**` cannot
# be expressed and every duplicated file has to be named. The list was seeded
# from the duplication report of 2026-07-23, i.e. from the pairs that exceeded
# Sonar's copy-paste threshold *on that day* — not from the pairs that are
# duplicated *by construction*. Every `snippets/<sdk>/<framework>.<ext>` is a
# verbatim extraction of the `region: quickstart` slice of its example
# entrypoint (scripts/extract_snippets.py, drift-gated by
# example-metadata-check.yml), so all 28 snippets duplicate their source by
# design; they appear here only once they grow past the detector's minimum
# block size. AAASM-6204 added one line plus a comment to all 16 Python
# quickstart regions, which pushed llamaindex-tool-policy over that boundary
# and failed the new-code duplication gate on a pair that was already 100%
# identical on main.
#
# So: when the duplication report names a new snippet/source pair, the pair is
# not a new code smell — extend this list with BOTH sides, keeping it sorted.
sonar.cpd.exclusions=go/langchaingo/policy.go,go/tool-policy/policy.go,node/custom-tool-policy/src/index.ts,node/custom-tool-policy/src/policy.ts,node/langchain-js-basic-agent/src/policy.ts,node/langgraph-js/src/policy.ts,node/mastra/src/policy.ts,node/openai-node-tool-policy/src/index.ts,node/openai-node-tool-policy/src/policy.ts,node/vercel-ai/src/policy.ts,python/agno-tool-policy/src/main.py,python/autogen-tool-policy/src/policy.py,python/crewai-research-crew/src/main.py,python/crewai-research-crew/src/policy.py,python/google-adk/src/policy.py,python/google-adk/tests/test_smoke.py,python/haystack-tool-policy/src/main.py,python/langchain-basic-agent/src/policy.py,python/langchain-research-agent/src/policy.py,python/langgraph/src/policy.py,python/llamaindex-tool-policy/src/main.py,python/microsoft-agent-framework-tool-policy/tests/test_smoke.py,python/pydantic-ai/src/policy.py,python/pydantic-ai/tests/test_smoke.py,python/semantic-kernel-tool-policy/src/policy.py,python/strands-agents-tool-policy/src/policy.py,snippets/node/custom-tool-policy.ts,snippets/node/openai-node-tool-policy.ts,snippets/python/agno-tool-policy.py,snippets/python/crewai-research-crew.py,snippets/python/haystack-tool-policy.py,snippets/python/llamaindex-tool-policy.py

