# Example SDK Mocks — assert no Python example patches a private part of the SDK.
#
# WHY THIS EXISTS
# ---------------
# AAASM-6156: all 16 framework examples patched the SDK's private
# `_register_adapters` helper with `return_value=[]` so `init_assembly(
# mode="sdk-only")` would run with no adapters installed. SDK `0.0.1rc7` changed
# that helper to return a 2-tuple, and because the old shape had been copied into
# 16 directories, one dependency bump turned every Python example red at once —
# each reporting `not enough values to unpack (expected 2, got 0)`, a message
# about a mock, for a change that broke no documented contract.
#
# `Verify Python Examples` would catch the *next* such break too, but only as 16
# opaque failures after the bump lands. This job refuses the coupling that makes
# that possible, at the moment it is introduced.
#
# WHY THERE IS NO `paths:` FILTER
# -------------------------------
# The gate's own discovery globs are part of what it asserts: if the example
# layout moves, the checker exits non-zero rather than reporting a clean tree it
# never read. A `paths:` filter keyed on today's layout would skip exactly the
# change that invalidates it. The checker is stdlib-only, parses ~32 small files
# and finishes well under a second, so it runs on every pull request instead.
#
# It also runs on pushes to `main`, so the default branch cannot drift red
# between merges — the same reasoning as `dependabot-coverage.yml`.
#
# NOT A REQUIRED CHECK
# --------------------
# `main`'s protection lists zero required status checks, so this job reports but
# does not block a merge. Changing that is owner-gated and tracked on AAASM-5677;
# this workflow leaves protection alone.

name: Example SDK Mocks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mocks:
    name: example sdk mock contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The checker's own tests run first. Its fixtures are the real pre-fix and
      # post-fix text, so these tests are what prove the gate can still tell the
      # AAASM-6156 defect from its fix — a parser that silently stopped matching
      # would report a clean result for a tree it did not understand.
      - name: Run the checker's unit tests
        run: python -m unittest scripts.test_check_example_sdk_mocks

      - name: Assert no example patches a private SDK seam
        run: python scripts/check_example_sdk_mocks.py
