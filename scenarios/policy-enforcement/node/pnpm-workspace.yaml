# Migrated from package.json's "pnpm.overrides" (no longer read by pnpm 11+,
# see https://pnpm.io/settings). AAASM-6032: a relock performed with pnpm 11
# silently dropped the "overrides" block package.json declared but pnpm no
# longer honours, breaking `--frozen-lockfile`. pnpm-workspace.yaml is the
# supported home for both pnpm 10 and 11, so a relock stays consistent
# regardless of which major version performs it.
overrides:
  esbuild: '>=0.28.1'
  vite: ^7.3.5

# AAASM-6243: pnpm 11 ignores onlyBuiltDependencies and reads allowBuilds
# instead, so `pnpm install` here exited 1 with ERR_PNPM_IGNORED_BUILDS
# despite the list below already naming esbuild. Both keys are kept:
# pnpm 10 honours the first, pnpm 11 the second.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
